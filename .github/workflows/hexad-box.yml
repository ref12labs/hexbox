# Written by hexad (Settings, Runner, Install/Update workflow); hexad replaces it when it is outdated, so do not edit it here.
# STUB_VERSION: 3
# This file is a stub and rarely changes: it holds only what must be YAML. The logic is in phase scripts that the hexad which starts the
# job serves (GET /daemon/script/<build>/<phase>), so it always matches that hexad's build.
# This repository is public: inputs and logs are visible to anyone. The one secret input is encrypted (AES-GCM) with the
# repository secret HEXAD_BOX_KEY, and the prepare step masks every value in it before anything can print it.
# Runs on Linux (ubuntu-latest) or Windows (windows-latest), chosen per session by the dispatch input os; every step runs in pwsh (PowerShell 7, preinstalled on both images).
# Caches: off by default (the prepare script then writes empty keys and every cache step below is skipped). With caching set to per-session
# the prepare script decides the keys and paths (step outputs), all of them carrying the session id and with no fallback to any other
# session, project or base branch; the actions/cache steps here pass them on.
# Outside contributors' workflows must need approval in this repository (Settings, Actions, General), because pull-request
# workflows can read the base branch's caches.
name: hexad-box
run-name: hexad-box ${{ inputs.session }} ${{ inputs.job }}

on:
  workflow_dispatch:
    inputs:
      session:
        description: The hexad session this box serves
        required: true
      job:
        description: This job's nonce, to find the run
        required: true
      bootstrap:
        description: Encrypted bootstrap (only hexad can read it)
        required: true
      base:
        description: Which project and base branch the workspace caches belong to (a hash)
        required: false
        default: none
      os:
        description: The runner's operating system
        required: false
        type: choice
        default: linux
        options:
          - linux
          - windows

permissions: {}

jobs:
  box:
    runs-on: ${{ inputs.os == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 350
    defaults:
      run:
        shell: pwsh
    steps:
      # A plain run: step does not get the runner's runtime token and results URL; a JavaScript action does. Pinned to a full commit SHA.
      - name: Expose the Actions runtime
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            // Hands the job the Actions runtime that a plain run: step does not get. The values are masked at once; hexad's daemon and its phase
            // scripts use them for the Actions cache, and the agent's tools get them too, to reach the cache and artifact APIs of this repository.
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              const value = process.env[name];
              if (!value) { core.warning(name + ' is not set: this job cannot use the Actions cache or artifact APIs directly'); continue; }
              core.setSecret(value);
              core.exportVariable(name, value);
            }

      - name: Prepare (decrypt the bootstrap, join hexad, fetch the scripts)
        id: prepare
        env:
          HEXAD_KEY: ${{ secrets.HEXAD_BOX_KEY }}
          HEXAD_BOOTSTRAP: ${{ inputs.bootstrap }}
          HEXAD_SESSION: ${{ inputs.session }}
          HEXAD_BASE: ${{ inputs.base }}
        run: |
          @'
          const crypto = require('crypto'), fs = require('fs'), path = require('path');
          const all = Buffer.from(process.env.HEXAD_BOOTSTRAP, 'base64');
          const d = crypto.createDecipheriv('aes-256-gcm', Buffer.from(process.env.HEXAD_KEY, 'base64'), all.subarray(0, 12));
          d.setAAD(Buffer.from(process.env.HEXAD_SESSION));
          d.setAuthTag(all.subarray(all.length - 16));
          const b = JSON.parse(Buffer.concat([d.update(all.subarray(12, all.length - 16)), d.final()]).toString('utf8'));
          const masks = new Set();
          for (const f of ['server', 'tunnelToken', 'tunnelHeaders', 'joinCode', 'deployKey', 'repo', 'branch']) {
            const v = b[f];
            if (!v) continue;
            // One line per command: a multi-line value is masked line by line, never whole.
            if (v.includes('\n')) { for (const l of v.split('\n')) if (l.trim()) masks.add(l.trim()); }
            else masks.add(v);
          }
          // Each header line's value is masked on its own too (a log line would print the value alone).
          for (const l of (b.tunnelHeaders || '').split('\n')) { const i = l.indexOf(':'); if (i > 0 && l.slice(i + 1).trim()) masks.add(l.slice(i + 1).trim()); }
          try { masks.add(new URL(b.server).hostname); } catch (e) { }
          for (const m of masks) console.log('::add-mask::' + m);
          const tmp = process.env.RUNNER_TEMP;
          fs.writeFileSync(path.join(tmp, 'hexad_key'), b.deployKey.endsWith('\n') ? b.deployKey : b.deployKey + '\n', { mode: 0o600 });
          // Paths for the scripts and for git's ssh (which runs the command through sh): forward slashes, also on Windows (D:\a\_temp -> D:/a/_temp).
          const slash = s => (s || '').replace(/\\/g, '/');
          const env = {
            HEXAD_TMP: slash(tmp), HEXAD_BOX: slash(process.env.GITHUB_WORKSPACE) + '/box', HEXAD_OS: process.platform === 'win32' ? 'windows' : 'linux',
            HEXAD_SESSION: process.env.HEXAD_SESSION, HEXAD_BASE: process.env.HEXAD_BASE || 'none',
            HEXAD_SERVER: b.server, HEXAD_TUNNEL_TOKEN: b.tunnelToken || '', HEXAD_TUNNEL_HEADERS: b.tunnelHeaders || '', HEXAD_JOIN_CODE: b.joinCode, HEXAD_REPO: b.repo, HEXAD_BRANCH: b.branch,
            HEXAD_CACHE: b.cache || 'off', HEXAD_BUILD: b.build, HEXAD_LABEL: b.label, HEXAD_IDLE: String(b.idleMinutes), HEXAD_MAX: String(b.maxMinutes),
          };
          for (const [k, v] of Object.entries(env)) {
            const eof = 'EOF_' + crypto.randomBytes(8).toString('hex');
            fs.appendFileSync(process.env.GITHUB_ENV, k + '<<' + eof + '\n' + v + '\n' + eof + '\n');
          }
          // For the rest of this step only: its pwsh reads this file into the environment and deletes it.
          fs.writeFileSync(path.join(tmp, 'hexad.env.json'), JSON.stringify(env), { mode: 0o600 });
          '@ | node -
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $envFile = Join-Path $env:RUNNER_TEMP 'hexad.env.json'
          foreach ($p in (Get-Content -Raw -LiteralPath $envFile | ConvertFrom-Json).PSObject.Properties) { Set-Item -Path ('env:' + $p.Name) -Value ([string]$p.Value) }
          Remove-Item -Force -LiteralPath $envFile
          function Fail($m) { Write-Host "::error::$m"; exit 1 }
          $hint = 'likely missing Access headers or a stale workflow file (update it under Settings, Runner)'
          # What the server's door needs on every call: a dev tunnel's token, or the tunnel bus's Access headers (one per line).
          $auth = @{}
          if ($env:HEXAD_TUNNEL_TOKEN) { $auth['X-Tunnel-Authorization'] = "tunnel $env:HEXAD_TUNNEL_TOKEN" }
          foreach ($line in ($env:HEXAD_TUNNEL_HEADERS -split "`n")) { $i = $line.IndexOf(':'); if ($i -gt 0) { $auth[$line.Substring(0, $i).Trim()] = $line.Substring($i + 1).Trim() } }
          New-Item -ItemType Directory -Force -Path "$env:HEXAD_TMP/phases" | Out-Null
          try { $r = Invoke-WebRequest -Method Post -Uri "$env:HEXAD_SERVER/daemon/join" -Headers $auth -ContentType 'application/json' -Body (@{ code = $env:HEXAD_JOIN_CODE } | ConvertTo-Json -Compress) -MaximumRetryCount 3 -RetryIntervalSec 3 }
          catch { Fail "hexad's /daemon/join refused the call ($($_.Exception.Message)): $hint" }
          $ct = "$($r.Headers['Content-Type'])"
          if ($ct -notlike 'application/json*') { Fail "hexad's /daemon/join answered with $ct, a login or HTML page and not JSON: $hint" }
          $token = ($r.Content | ConvertFrom-Json).token
          if (-not $token) { Fail "hexad's /daemon/join answered without a token: $hint" }
          Write-Host "::add-mask::$token"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "HEXAD_DAEMON_TOKEN=$token"
          $env:HEXAD_DAEMON_TOKEN = $token
          $auth['Authorization'] = "Bearer $token"
          $prepare = "$env:HEXAD_TMP/phases/prepare.ps1"
          try { $r = Invoke-WebRequest -Uri "$env:HEXAD_SERVER/daemon/script/$env:HEXAD_BUILD/prepare" -Headers $auth -OutFile $prepare -PassThru -MaximumRetryCount 3 -RetryIntervalSec 3 }
          catch { Fail "hexad has no phase scripts for build $env:HEXAD_BUILD ($($_.Exception.Message)): is this workflow newer than the hexad that started the job?" }
          if ("$($r.Headers['Content-Type'])" -like 'text/html*') { Fail "hexad's prepare script came as an HTML page, not a script: $hint" }
          pwsh -NoProfile -File $prepare
          exit $LASTEXITCODE

      - name: Restore the package caches
        id: pkg
        if: steps.prepare.outputs.pkg_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.prepare.outputs.pkg_paths }}
          key: ${{ steps.prepare.outputs.pkg_key }}
          restore-keys: ${{ steps.prepare.outputs.pkg_restore_keys }}

      - name: Restore the workspace's build folders
        id: ws
        if: steps.prepare.outputs.ws_restore_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.prepare.outputs.ws_paths }}
          key: ${{ steps.prepare.outputs.ws_restore_key }}
          restore-keys: ${{ steps.prepare.outputs.ws_restore_keys }}

      - name: Restore (open the encrypted workspace cache, when there is one)
        if: steps.prepare.outputs.ws_restore_key != ''
        continue-on-error: true
        env:
          HEXAD_CACHE_KEY: ${{ secrets.HEXAD_BOX_KEY }}
        run: pwsh -NoProfile -File "$env:HEXAD_TMP/phases/restore.ps1"

      - name: Run the daemon (until hexad stops it, it idles out, or the time limit)
        timeout-minutes: 345
        run: pwsh -NoProfile -File "$env:HEXAD_TMP/phases/run.ps1"

      - name: Wrap up (push the work, pack the build folders)
        if: always()
        env:
          HEXAD_CACHE_KEY: ${{ secrets.HEXAD_BOX_KEY }}
        run: |
          $f = "$env:HEXAD_TMP/phases/wrapup.ps1"
          if ($env:HEXAD_TMP -and (Test-Path -LiteralPath $f)) { pwsh -NoProfile -File $f } else { Write-Host "::warning::the prepare step did not finish, so there is nothing to wrap up" }

      # The reserved final steps: after the daemon has exited and the work is pushed, the caches are saved (a cache that cannot be saved
      # is a warning, never a failure of the job). A cache restored under its exact key is not saved again.
      - name: Save the workspace's build folders
        if: always() && steps.prepare.outputs.ws_save_key != '' && steps.ws.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.prepare.outputs.ws_paths }}
          key: ${{ steps.prepare.outputs.ws_save_key }}

      - name: Save the package caches
        if: always() && steps.prepare.outputs.pkg_key != '' && steps.pkg.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.prepare.outputs.pkg_paths }}
          key: ${{ steps.prepare.outputs.pkg_key }}
