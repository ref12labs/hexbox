name: Runner relay
run-name: relay ${{ inputs.repo }} run-${{ inputs.run_id }} job-${{ inputs.job_id }} (${{ inputs.os }})

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Private repository (owner/name)
        required: true
        type: string
      run_id:
        description: Private workflow run ID
        required: true
        type: string
      job_id:
        description: Private workflow job ID
        required: true
        type: string
      os:
        description: Runner OS
        required: true
        type: choice
        options: [linux, windows]

permissions:
  contents: read

# Delivery retries must not cancel a runner already serving a private job.
concurrency:
  group: relay-${{ inputs.repo }}-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ${{ inputs.os == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Serve one private job
        shell: pwsh
        env:
          RELAY_GITHUB_TOKEN: ${{ secrets.RELAY_GITHUB_TOKEN }}
          RELAY_REPO: ${{ inputs.repo }}
          RELAY_RUN_ID: ${{ inputs.run_id }}
          RELAY_JOB_ID: ${{ inputs.job_id }}
          RELAY_OS: ${{ inputs.os }}
        run: python scripts/relay.py
